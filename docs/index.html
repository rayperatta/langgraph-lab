<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LangGraph Lab — Domina LangChain + LangGraph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #05070f;
    --glass: rgba(255,255,255,.045);
    --glass-strong: rgba(255,255,255,.07);
    --stroke: rgba(255,255,255,.09);
    --stroke-glow: rgba(34,211,238,.35);
    --text: #e8edf7;
    --muted: #8b93a7;
    --cyan: #22d3ee;
    --violet: #8b5cf6;
    --pink: #f472b6;
    --green: #34d399;
    --grad: linear-gradient(120deg, var(--cyan), var(--violet) 55%, var(--pink));
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
    min-height: 100vh; overflow-x: hidden;
  }

  /* ── Fondo futurista ─────────────────────────────── */
  .orb { position: fixed; border-radius: 50%; filter: blur(90px); opacity: .5; z-index: 0; pointer-events: none; }
  .orb.a { width: 520px; height: 520px; top: -160px; left: -120px;
    background: radial-gradient(circle, rgba(34,211,238,.28), transparent 65%); animation: drift 26s ease-in-out infinite; }
  .orb.b { width: 620px; height: 620px; bottom: -220px; right: -160px;
    background: radial-gradient(circle, rgba(139,92,246,.26), transparent 65%); animation: drift 32s ease-in-out infinite reverse; }
  .orb.c { width: 380px; height: 380px; top: 40%; left: 45%;
    background: radial-gradient(circle, rgba(244,114,182,.14), transparent 65%); animation: drift 38s ease-in-out infinite; }
  @keyframes drift {
    0%,100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(50px,-40px) scale(1.08); }
    66% { transform: translate(-40px,30px) scale(.94); }
  }
  .grid-overlay {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 90% 70% at 50% 30%, #000 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 30%, #000 30%, transparent 75%);
  }

  .layout { position: relative; z-index: 1; display: flex; min-height: 100vh; }

  /* ── Sidebar glass ───────────────────────────────── */
  aside {
    width: 300px; min-width: 300px; height: 100vh; position: sticky; top: 0;
    background: rgba(10,14,24,.55); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    border-right: 1px solid var(--stroke);
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .brand { padding: 26px 24px 18px; border-bottom: 1px solid var(--stroke); }
  .brand h1 { font-family: 'Space Grotesk', sans-serif; font-size: 21px; letter-spacing: -.3px; }
  .brand h1 span {
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .brand p { font-size: 12px; color: var(--muted); margin-top: 5px; }

  .progress-wrap { padding: 16px 24px; border-bottom: 1px solid var(--stroke); }
  .progress-label { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-bottom: 8px; }
  .progress-label b { color: var(--cyan); font-weight: 600; }
  .progress-bar { height: 6px; border-radius: 99px; background: rgba(255,255,255,.07); overflow: hidden; }
  .progress-fill {
    height: 100%; width: 0%; border-radius: 99px; background: var(--grad);
    box-shadow: 0 0 12px rgba(34,211,238,.55); transition: width .5s cubic-bezier(.2,.8,.2,1);
  }

  nav { flex: 1; padding: 14px 14px; }
  .nav-item {
    display: flex; gap: 13px; align-items: flex-start; padding: 11px 12px;
    border-radius: 12px; text-decoration: none; color: var(--text);
    border: 1px solid transparent; transition: all .18s; position: relative;
  }
  .nav-item:hover { background: var(--glass); border-color: var(--stroke); }
  .nav-item.active {
    background: var(--glass-strong); border-color: var(--stroke-glow);
    box-shadow: 0 0 22px rgba(34,211,238,.12), inset 0 0 18px rgba(34,211,238,.04);
  }
  .node {
    width: 30px; height: 30px; min-width: 30px; border-radius: 50%;
    display: grid; place-items: center; font-family: 'Space Grotesk'; font-size: 12px; font-weight: 600;
    background: rgba(255,255,255,.06); border: 1px solid var(--stroke); color: var(--muted);
    transition: all .25s;
  }
  .nav-item.active .node { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 12px rgba(34,211,238,.4); }
  .nav-item.done .node {
    background: linear-gradient(135deg, rgba(52,211,153,.25), rgba(34,211,238,.25));
    border-color: rgba(52,211,153,.6); color: var(--green);
  }
  .nav-text b { display: block; font-size: 13.5px; font-weight: 600; letter-spacing: -.1px; }
  .nav-text small { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.4; }

  .side-footer { padding: 16px 24px; border-top: 1px solid var(--stroke); }
  .side-footer a {
    color: var(--muted); font-size: 12.5px; text-decoration: none;
    display: inline-flex; align-items: center; gap: 7px; transition: color .2s;
  }
  .side-footer a:hover { color: var(--cyan); }

  /* ── Contenido ───────────────────────────────────── */
  main { flex: 1; padding: 44px 48px 100px; max-width: 1020px; width: 100%; margin: 0 auto; }

  .hero { text-align: center; padding: 40px 0 34px; }
  .hero .pill {
    display: inline-block; font-size: 11.5px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--cyan); padding: 6px 16px; border-radius: 99px;
    border: 1px solid rgba(34,211,238,.35); background: rgba(34,211,238,.07);
    box-shadow: 0 0 20px rgba(34,211,238,.12); margin-bottom: 22px;
  }
  .hero h2 {
    font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 5vw, 48px);
    font-weight: 700; letter-spacing: -1.2px; line-height: 1.08;
  }
  .hero h2 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { color: var(--muted); font-size: 15.5px; margin-top: 14px; }
  .chips { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
  .chip {
    font-size: 12.5px; padding: 7px 15px; border-radius: 99px;
    background: var(--glass); border: 1px solid var(--stroke); color: var(--text);
    backdrop-filter: blur(10px);
  }
  .chip b { color: var(--cyan); }

  .glass-card {
    background: var(--glass); border: 1px solid var(--stroke); border-radius: 18px;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 18px 50px rgba(0,0,0,.35); overflow: hidden;
  }

  /* Cabecera de lección */
  .lesson-head { position: relative; padding: 34px 36px 26px; border-bottom: 1px solid var(--stroke); overflow: hidden; }
  .lesson-head::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(34,211,238,.09), transparent 45%, rgba(139,92,246,.09));
    pointer-events: none;
  }
  .lesson-num {
    position: absolute; right: 22px; top: -14px; font-family: 'Space Grotesk';
    font-size: 120px; font-weight: 700; color: rgba(255,255,255,.045); line-height: 1; user-select: none;
  }
  .lesson-head .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; position: relative; }
  .tag {
    font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase;
    padding: 4px 12px; border-radius: 99px;
    border: 1px solid rgba(139,92,246,.4); color: #c4b5fd; background: rgba(139,92,246,.1);
  }
  .tag.run { border-color: rgba(52,211,153,.45); color: var(--green); background: rgba(52,211,153,.08); }
  .lesson-head h2 { font-family: 'Space Grotesk'; font-size: 28px; letter-spacing: -.5px; position: relative; }
  .lesson-head p { color: var(--muted); font-size: 14px; margin-top: 7px; position: relative; }

  /* Código */
  .code-wrap { position: relative; }
  .code-toolbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 18px; border-bottom: 1px solid var(--stroke);
    font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', monospace;
  }
  .copy-btn {
    background: var(--glass); border: 1px solid var(--stroke); color: var(--text);
    font-size: 11.5px; font-family: 'Inter'; padding: 5px 12px; border-radius: 8px; cursor: pointer;
    transition: all .18s;
  }
  .copy-btn:hover { border-color: var(--cyan); color: var(--cyan); }
  pre { margin: 0; max-height: 72vh; overflow: auto; }
  pre code {
    display: block; padding: 20px 22px; background: transparent !important;
    font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.65;
  }
  pre::-webkit-scrollbar, aside::-webkit-scrollbar { width: 8px; height: 8px; }
  pre::-webkit-scrollbar-thumb, aside::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 99px; }

  /* Navegación inferior */
  .lesson-nav { display: flex; gap: 14px; margin-top: 26px; align-items: stretch; }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column; gap: 3px; padding: 15px 20px;
    border-radius: 14px; text-decoration: none; color: var(--text);
    background: var(--glass); border: 1px solid var(--stroke);
    backdrop-filter: blur(14px); transition: all .2s;
  }
  .nav-btn:hover { border-color: var(--stroke-glow); box-shadow: 0 0 24px rgba(34,211,238,.1); transform: translateY(-2px); }
  .nav-btn small { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .nav-btn b { font-family: 'Space Grotesk'; font-size: 14.5px; }
  .nav-btn.next { text-align: right; }
  .nav-btn.disabled { opacity: .35; pointer-events: none; }
  .done-btn {
    min-width: 190px; border-radius: 14px; cursor: pointer; font-family: 'Space Grotesk'; font-weight: 600; font-size: 14px;
    color: var(--text); background: var(--glass); border: 1px solid var(--stroke); transition: all .22s;
  }
  .done-btn:hover { border-color: rgba(52,211,153,.5); }
  .done-btn.completed {
    background: linear-gradient(135deg, rgba(52,211,153,.22), rgba(34,211,238,.22));
    border-color: rgba(52,211,153,.65); color: var(--green);
    box-shadow: 0 0 26px rgba(52,211,153,.18);
  }

  /* Markdown (README) */
  .md { padding: 34px 38px; }
  .md h1, .md h2, .md h3 { font-family: 'Space Grotesk'; margin: 26px 0 12px; letter-spacing: -.4px; }
  .md h1 { font-size: 26px; } .md h2 { font-size: 20px; padding-bottom: 8px; border-bottom: 1px solid var(--stroke); }
  .md p, .md li { font-size: 14.5px; line-height: 1.75; }
  .md ul, .md ol { padding-left: 22px; margin: 10px 0; }
  .md table { border-collapse: collapse; margin: 16px 0; width: 100%; font-size: 13.5px; }
  .md th, .md td { border: 1px solid var(--stroke); padding: 9px 13px; text-align: left; }
  .md th { background: rgba(255,255,255,.05); font-family: 'Space Grotesk'; }
  .md code:not(pre code) {
    background: rgba(34,211,238,.09); border: 1px solid rgba(34,211,238,.18);
    padding: 2px 7px; border-radius: 6px; font-size: 12.5px; font-family: 'JetBrains Mono';
  }
  .md a { color: var(--cyan); }
  .md pre { border: 1px solid var(--stroke); border-radius: 12px; background: rgba(0,0,0,.3); margin: 14px 0; max-height: none; }
  .md pre code { padding: 14px 16px; font-size: 12.5px; }

  .loading { text-align: center; color: var(--muted); padding: 70px 0; font-size: 14px; }
  .loading::after { content: '…'; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% {content:''} 25% {content:'.'} 50% {content:'..'} 75% {content:'...'} }
  .err { color: #fb7185; }

  .fade-in { animation: fadeUp .4s cubic-bezier(.2,.8,.2,1); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  /* Mobile */
  #toggle {
    display: none; position: fixed; top: 14px; left: 14px; z-index: 20;
    width: 42px; height: 42px; border-radius: 12px; font-size: 17px; cursor: pointer;
    background: rgba(10,14,24,.7); backdrop-filter: blur(14px);
    border: 1px solid var(--stroke); color: var(--text);
  }
  @media (max-width: 860px) {
    #toggle { display: block; }
    aside { position: fixed; left: -320px; transition: left .28s cubic-bezier(.2,.8,.2,1); z-index: 15; }
    aside.open { left: 0; box-shadow: 30px 0 60px rgba(0,0,0,.5); }
    main { padding: 70px 16px 80px; }
    .md { padding: 24px 20px; }
    .lesson-head { padding: 26px 22px 20px; }
    .lesson-num { font-size: 84px; }
    .lesson-nav { flex-direction: column; }
    .done-btn { padding: 14px; }
  }
</style>
</head>
<body>
<div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
<div class="grid-overlay"></div>

<button id="toggle" onclick="document.querySelector('aside').classList.toggle('open')">☰</button>

<div class="layout">
  <aside>
    <div class="brand">
      <h1>LangGraph <span>Lab</span> ⚗️</h1>
      <p>De cero a agentes con LangChain + LangGraph</p>
    </div>
    <div class="progress-wrap">
      <div class="progress-label"><span>Tu progreso</span><b id="prog-text">0 / 7</b></div>
      <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-footer">
      <a href="https://github.com/rayperatta/langgraph-lab" target="_blank">⌥ Repo en GitHub ↗</a>
    </div>
  </aside>
  <main id="content"><div class="loading">Cargando</div></main>
</div>

<script>
const RAW = 'https://raw.githubusercontent.com/rayperatta/langgraph-lab/master/';
const LESSONS = [
  { id: 'README.md', title: 'Inicio', sub: 'Qué es esto y cómo empezar', home: true, icon: '⌂' },
  { id: 'CHEATSHEET.md', title: 'Cheat Sheet ⚡', sub: 'Todo lo esencial en 1 página', md: true, icon: '⚡' },
  { id: '01_langchain_basico.py', num: '01', title: 'LangChain básico', sub: 'LLM, prompts y chains LCEL', tags: ['LLM', 'LCEL'] },
  { id: '02_langchain_tools.py', num: '02', title: 'Tools', sub: 'El modelo pide, tu código ejecuta', tags: ['@tool', 'bind_tools'] },
  { id: '03_langgraph_estado.py', num: '03', title: 'Estado en LangGraph', sub: 'StateGraph: nodos y edges', tags: ['StateGraph', 'Grafos'] },
  { id: '04_langgraph_condicional.py', num: '04', title: 'Edges condicionales', sub: 'Routers: la base de todo agente', tags: ['Routers', 'Reducers'] },
  { id: '05_langgraph_agente.py', num: '05', title: 'Agente ReAct', sub: 'El bucle llm ⇄ tools', tags: ['ReAct', 'ToolNode'] },
  { id: '06_langgraph_memoria.py', num: '06', title: 'Memoria', sub: 'Checkpoints y threads · opcional', tags: ['Checkpointer', 'Threads'], optional: true },
  { id: '07_langgraph_humano.py', num: '07', title: 'Human-in-the-loop', sub: 'interrupt() + resume · opcional', tags: ['HITL', 'Supervisión'], optional: true },
];
const KEY = 'langgraph-lab-progress';
const getDone = () => { try { return new Set(JSON.parse(localStorage.getItem(KEY)) || []); } catch { return new Set(); } };
const saveDone = s => localStorage.setItem(KEY, JSON.stringify([...s]));

const nav = document.getElementById('nav');
const content = document.getElementById('content');

function renderNav() {
  const done = getDone();
  nav.innerHTML = '';
  LESSONS.forEach(l => {
    const a = document.createElement('a');
    a.href = '#' + l.id;
    a.className = 'nav-item' + (done.has(l.id) ? ' done' : '');
    a.dataset.id = l.id;
    a.innerHTML = `<div class="node">${done.has(l.id) ? '✓' : (l.icon || l.num)}</div>
      <div class="nav-text"><b>${l.home ? '🏠 ' : ''}${l.optional ? '🕶 ' : ''}${l.title}</b><small>${l.sub}</small></div>`;
    a.onclick = () => document.querySelector('aside').classList.remove('open');
    nav.appendChild(a);
  });
  const n = LESSONS.filter(l => l.num && done.has(l.id)).length;
  const total = LESSONS.filter(l => l.num).length;
  document.getElementById('prog-text').textContent = `${n} / ${total}`;
  document.getElementById('prog-fill').style.width = (n / total * 100) + '%';
}

function lessonNavHTML(id) {
  const i = LESSONS.findIndex(l => l.id === id);
  const prev = LESSONS[i - 1], next = LESSONS[i + 1];
  const done = getDone().has(id);
  return `<div class="lesson-nav">
    <a class="nav-btn ${prev ? '' : 'disabled'}" href="#${prev ? prev.id : ''}">
      <small>← Anterior</small><b>${prev ? prev.title : '—'}</b></a>
    <button class="done-btn ${done ? 'completed' : ''}" onclick="toggleDone('${id}')">
      ${done ? '✓ Completada' : 'Marcar completada'}</button>
    <a class="nav-btn next ${next ? '' : 'disabled'}" href="#${next ? next.id : ''}">
      <small>Siguiente →</small><b>${next ? next.title : '—'}</b></a>
  </div>`;
}

window.toggleDone = id => {
  const s = getDone();
  s.has(id) ? s.delete(id) : s.add(id);
  saveDone(s); renderNav(); load(id, true);
};

async function load(id, keepScroll) {
  document.querySelectorAll('.nav-item').forEach(a => a.classList.toggle('active', a.dataset.id === id));
  content.innerHTML = '<div class="loading">Cargando</div>';
  try {
    const res = await fetch(RAW + id + '?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const lesson = LESSONS.find(l => l.id === id);

    if (lesson.md && !lesson.home) {
      content.innerHTML = `<div class="fade-in">
        <div class="glass-card md">${marked.parse(text)}</div>
        ${lessonNavHTML(id)}
      </div>`;
    } else if (lesson.home) {
      content.innerHTML = `<div class="fade-in">
        <div class="hero">
          <div class="pill">⚗️ Ruta práctica · 7 lecciones</div>
          <h2>Domina <em>LangChain + LangGraph</em><br>ejecutando código real</h2>
          <p>Sin teoría infinita. Cada lección es un archivo corto, comentado y ejecutable.</p>
          <div class="chips">
            <div class="chip"><b>7</b> lecciones progresivas</div>
            <div class="chip"><b>~20 min</b> por lección</div>
            <div class="chip"><b>0 €</b> modo fake offline</div>
            <div class="chip">Ejercicios <b>🧠</b> incluidos</div>
          </div>
        </div>
        <div class="glass-card md">${marked.parse(text)}</div>
        ${lessonNavHTML(id)}
      </div>`;
    } else {
      content.innerHTML = `<div class="fade-in">
        <div class="glass-card">
          <div class="lesson-head">
            <div class="lesson-num">${lesson.num}</div>
            <div class="tags">
              ${lesson.tags.map(t => `<span class="tag">${t}</span>`).join('')}
              <span class="tag run">⚡ python ${lesson.id}</span>
              <span class="tag run">⏱ ~20 min</span>
            </div>
            <h2>Lección ${lesson.num} · ${lesson.title}</h2>
            <p>${lesson.sub}</p>
          </div>
          <div class="code-wrap">
            <div class="code-toolbar"><span>🐍 ${lesson.id}</span>
              <button class="copy-btn" onclick="copyCode(this)">⧉ Copiar</button></div>
            <pre><code class="language-python"></code></pre>
          </div>
        </div>
        ${lessonNavHTML(id)}
      </div>`;
      const code = content.querySelector('pre code');
      code.textContent = text;
      hljs.highlightElement(code);
    }
    if (!keepScroll) window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    content.innerHTML = `<div class="loading err">Error cargando ${id}: ${e.message}</div>`;
  }
}

window.copyCode = btn => {
  navigator.clipboard.writeText(btn.closest('.code-wrap').querySelector('code').textContent);
  btn.textContent = '✓ Copiado';
  setTimeout(() => btn.textContent = '⧉ Copiar', 1600);
};

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const id = location.hash.slice(1) || 'README.md';
  const i = LESSONS.findIndex(l => l.id === id);
  if (e.key === 'ArrowRight' && LESSONS[i + 1]) location.hash = LESSONS[i + 1].id;
  if (e.key === 'ArrowLeft' && LESSONS[i - 1]) location.hash = LESSONS[i - 1].id;
});

function route() {
  const id = location.hash.slice(1) || 'README.md';
  load(LESSONS.some(l => l.id === id) ? id : 'README.md');
}
window.addEventListener('hashchange', route);
renderNav();
route();
</script>
</body>
</html>

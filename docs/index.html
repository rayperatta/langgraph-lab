<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LangGraph Lab — Aprende LangChain + LangGraph</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #0d1117; --bg2: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --green: #3fb950;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }
  .layout { display: flex; min-height: 100vh; }

  /* Sidebar */
  aside {
    width: 280px; min-width: 280px; background: var(--bg2);
    border-right: 1px solid var(--border); padding: 20px 0;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  aside h1 { font-size: 18px; padding: 0 20px 6px; }
  aside h1 .lab { color: var(--accent); }
  aside .sub { font-size: 12px; color: var(--muted); padding: 0 20px 16px; border-bottom: 1px solid var(--border); }
  nav a {
    display: block; padding: 10px 20px; color: var(--text); text-decoration: none;
    font-size: 14px; border-left: 3px solid transparent;
  }
  nav a small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  nav a:hover { background: rgba(88,166,255,.08); }
  nav a.active { border-left-color: var(--accent); background: rgba(88,166,255,.12); }
  .gh-link { padding: 16px 20px; border-top: 1px solid var(--border); margin-top: 10px; }
  .gh-link a { color: var(--muted); font-size: 13px; text-decoration: none; }
  .gh-link a:hover { color: var(--accent); }

  /* Content */
  main { flex: 1; padding: 32px 40px 80px; max-width: 980px; }
  .badge {
    display: inline-block; font-size: 11px; color: var(--green);
    border: 1px solid var(--green); border-radius: 12px; padding: 2px 10px; margin-bottom: 12px;
  }
  pre {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; overflow-x: auto; font-size: 13.5px; line-height: 1.55;
  }
  code { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }

  /* Markdown (README) */
  .md h1, .md h2, .md h3 { margin: 24px 0 12px; }
  .md h1 { font-size: 28px; } .md h2 { font-size: 22px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .md p, .md li { font-size: 15px; line-height: 1.7; color: var(--text); }
  .md ul, .md ol { padding-left: 24px; margin: 10px 0; }
  .md table { border-collapse: collapse; margin: 16px 0; width: 100%; }
  .md th, .md td { border: 1px solid var(--border); padding: 8px 12px; font-size: 14px; text-align: left; }
  .md th { background: var(--bg2); }
  .md code:not(pre code) { background: var(--bg2); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
  .md a { color: var(--accent); }
  .md pre { margin: 14px 0; }

  .loading { color: var(--muted); font-size: 14px; padding: 40px 0; text-align: center; }
  .err { color: #f85149; }

  /* Mobile */
  #toggle { display: none; position: fixed; top: 12px; left: 12px; z-index: 10;
    background: var(--bg2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 8px 12px; font-size: 18px; cursor: pointer; }
  @media (max-width: 820px) {
    #toggle { display: block; }
    aside { position: fixed; left: -290px; transition: left .25s; z-index: 9; }
    aside.open { left: 0; }
    main { padding: 60px 18px 60px; }
  }
</style>
</head>
<body>
<button id="toggle" onclick="document.querySelector('aside').classList.toggle('open')">☰</button>
<div class="layout">
  <aside>
    <h1>🧪 LangGraph <span class="lab">Lab</span></h1>
    <div class="sub">Aprende LangChain + LangGraph ejecutando código real</div>
    <nav id="nav"></nav>
    <div class="gh-link">
      <a href="https://github.com/rayperatta/langgraph-lab" target="_blank">⌥ Ver repo en GitHub</a>
    </div>
  </aside>
  <main id="content"><div class="loading">Cargando…</div></main>
</div>

<script>
const RAW = 'https://raw.githubusercontent.com/rayperatta/langgraph-lab/master/';
const LESSONS = [
  { id: 'README.md',               title: '🏠 Inicio',                sub: 'README y setup' },
  { id: '01_langchain_basico.py',  title: '01 · LangChain básico',    sub: 'LLM, prompts, chains (LCEL)' },
  { id: '02_langchain_tools.py',   title: '02 · Tools',               sub: 'Cómo el modelo invoca herramientas' },
  { id: '03_langgraph_estado.py',  title: '03 · Estado en LangGraph', sub: 'StateGraph, nodos y edges' },
  { id: '04_langgraph_condicional.py', title: '04 · Edges condicionales', sub: 'Routers y reducers' },
  { id: '05_langgraph_agente.py',  title: '05 · Agente ReAct',        sub: 'Bucle llm ⇄ tools en un grafo' },
  { id: '06_langgraph_memoria.py', title: '06 · Memoria',             sub: 'Checkpoints y threads' },
  { id: '07_langgraph_humano.py',  title: '07 · Human-in-the-loop',   sub: 'interrupt() + resume' },
];

const nav = document.getElementById('nav');
const content = document.getElementById('content');

LESSONS.forEach(l => {
  const a = document.createElement('a');
  a.href = '#' + l.id;
  a.innerHTML = `${l.title}<small>${l.sub}</small>`;
  a.dataset.id = l.id;
  a.onclick = () => document.querySelector('aside').classList.remove('open');
  nav.appendChild(a);
});

async function load(id) {
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.dataset.id === id));
  content.innerHTML = '<div class="loading">Cargando…</div>';
  try {
    const res = await fetch(RAW + id);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    if (id.endsWith('.md')) {
      content.innerHTML = '<div class="md">' + marked.parse(text) + '</div>';
    } else {
      const lesson = LESSONS.find(l => l.id === id);
      content.innerHTML =
        `<div class="badge">⚡ Ejecutable: python ${id}</div>` +
        `<h2 style="margin-bottom:16px">${lesson.title}</h2>` +
        `<pre><code class="language-python"></code></pre>`;
      content.querySelector('code').textContent = text;
      hljs.highlightElement(content.querySelector('code'));
    }
    window.scrollTo(0, 0);
  } catch (e) {
    content.innerHTML = `<div class="loading err">Error cargando ${id}: ${e.message}</div>`;
  }
}

function route() {
  const id = location.hash.slice(1) || 'README.md';
  load(LESSONS.some(l => l.id === id) ? id : 'README.md');
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
